services:
  # 1. AI Python Service
  - type: web
    name: aitrip-ai-service
    env: python
    region: singapore
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  # 2. Node Express Backend
  - type: web
    name: aitrip-backend
    env: node
    region: singapore
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push && npx ts-node prisma/seedIndiaData.ts && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aitrip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: aitrip-ai-service
          property: host

databases:
  # Managed PostgreSQL Database
  - name: aitrip-db
    region: singapore
    databaseName: ai_trip_planner
